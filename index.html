<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LiveHub</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #f7f7f7;
  color: #222;
}

header {
  background: white;
  padding: 18px 20px 10px;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid #eee;
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: 800;
  color: #e60012;
  margin-bottom: 18px;
}

.platforms {
  display: flex;
  gap: 24px;
  overflow-x: auto;
  padding-bottom: 10px;
}

.platform {
  white-space: nowrap;
  color: #555;
  font-size: 14px;
  cursor: pointer;
  padding-bottom: 8px;
}

.platform.active {
  color: #e60012;
  font-weight: bold;
  border-bottom: 3px solid #e60012;
}

main {
  padding: 25px 16px 100px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.section-title h2 {
  color: #e60012;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.card {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
  cursor: pointer;
}

.thumbnail {
  height: 130px;
  position: relative;
  background: #ddd;
}

.thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.live {
  position: absolute;
  top: 8px;
  left: 8px;
  background: #e60012;
  color: white;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: bold;
}

.card-content {
  padding: 12px;
}

.name {
  font-weight: bold;
}

.title {
  font-size: 13px;
  margin-top: 7px;
}

.info {
  color: #777;
  font-size: 12px;
  margin-top: 8px;
}

.search-box {
  display: flex;
  gap: 8px;
  margin: 20px 0;
}

.search-box input {
  flex: 1;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
}

.search-box button,
.register-button,
.open-button {
  border: none;
  background: #e60012;
  color: white;
  padding: 10px 13px;
  border-radius: 10px;
  font-weight: bold;
}

.channel {
  background: white;
  padding: 14px;
  border-radius: 15px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,.07);
}

.channel img {
  width: 55px;
  height: 55px;
  border-radius: 50%;
}

.channel-info {
  flex: 1;
}

.channel-name {
  font-weight: bold;
}

.channel-title {
  color: #777;
  font-size: 12px;
  margin-top: 5px;
}

.register-button.registered {
  background: #777;
}

.following-channel {
  background: white;
  padding: 14px;
  border-radius: 15px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.following-channel img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
}

.following-info {
  flex: 1;
}

.remove-button {
  border: none;
  padding: 9px 12px;
  border-radius: 10px;
}

.empty {
  text-align: center;
  color: #777;
  padding: 40px 10px;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 75px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.nav-item {
  text-align: center;
  font-size: 11px;
  color: #666;
  cursor: pointer;
}

.nav-item .icon {
  display: block;
  font-size: 24px;
}

.nav-item.active {
  color: #e60012;
  font-weight: bold;
}

@media (min-width: 700px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<header>

<div class="logo">📡 LiveHub</div>

<div class="platforms">

<div class="platform active"
onclick="setPlatform('all', this)">
すべて
</div>

<div class="platform"
onclick="setPlatform('youtube', this)">
YouTube
</div>

<div class="platform"
onclick="setPlatform('twitch', this)">
Twitch
</div>

<div class="platform"
onclick="setPlatform('twitcasting', this)">
ツイキャス
</div>

</div>

</header>


<main>

<!-- ホーム -->

<div id="homePage" class="page active">

<div class="section-title">
<h2>🔴 LIVE NOW</h2>
</div>

<div id="liveGrid" class="grid"></div>

</div>


<!-- 検索 -->

<div id="searchPage" class="page">

<div class="section-title">
<h2>🔍 チャンネル検索</h2>
</div>

<div class="search-box">

<input
id="searchInput"
placeholder="配信者・チャンネル名を検索"
>

<button onclick="searchCurrentPlatform()">
検索
</button>

</div>

<div id="searchResult">
検索したい名前を入力してください
</div>

</div>


<!-- 登録中 -->

<div id="followingPage" class="page">

<div class="section-title">
<h2>☆ 登録中</h2>
</div>

<div id="followingList"></div>

</div>


<!-- 通知 -->

<div id="notificationPage" class="page">

<h2>♧ 通知</h2>

<p>通知はありません。</p>

</div>


<!-- 設定 -->

<div id="settingsPage" class="page">

<h2>⚙ 設定</h2>

<p>LiveHub Settings</p>

</div>

</main>


<nav class="bottom-nav">

<div class="nav-item active"
onclick="showPage('homePage', this)">

<span class="icon">⌂</span>
ホーム

</div>

<div class="nav-item"
onclick="showPage('searchPage', this)">

<span class="icon">⌕</span>
検索

</div>

<div class="nav-item"
onclick="showPage('followingPage', this)">

<span class="icon">☆</span>
登録中

</div>

<div class="nav-item"
onclick="showPage('notificationPage', this)">

<span class="icon">♧</span>
通知

</div>

<div class="nav-item"
onclick="showPage('settingsPage', this)">

<span class="icon">⚙</span>
設定

</div>

</nav>


<script>

/* =========================
   API設定
========================= */

const YOUTUBE_API_KEY =
"YOUR_YOUTUBE_API_KEY_HERE";


/* =========================
   現在選択中のサービス
========================= */

let currentPlatform = "all";


function setPlatform(platform, element) {

currentPlatform = platform;

document.querySelectorAll(".platform").forEach(item => {
item.classList.remove("active");
});

element.classList.add("active");

const result =
document.getElementById("searchResult");

if (platform === "all") {

result.innerHTML =
"すべてのサービスを検索します";

}

if (platform === "youtube") {

result.innerHTML =
"YouTubeを検索します";

}

if (platform === "twitch") {

result.innerHTML =
"Twitchを検索します";

}

if (platform === "twitcasting") {

result.innerHTML =
"ツイキャスを検索します";

}

}


/* =========================
   ページ切り替え
========================= */

function showPage(pageId, element) {

document.querySelectorAll(".page").forEach(page => {
page.classList.remove("active");
});

document.getElementById(pageId)
.classList.add("active");

document.querySelectorAll(".nav-item")
.forEach(item => {
item.classList.remove("active");
});

element.classList.add("active");

if (pageId === "followingPage") {
loadFollowing();
}

if (pageId === "homePage") {
loadLiveStreams();
}

}


/* =========================
   登録データ
========================= */

function getFollowing() {

return JSON.parse(
localStorage.getItem("livehub_following")
|| "[]"
);

}


function saveFollowing(data) {

localStorage.setItem(
"livehub_following",
JSON.stringify(data)
);

}


/* =========================
   検索
========================= */

function searchCurrentPlatform() {

if (currentPlatform === "youtube") {
searchYouTube();
return;
}

if (currentPlatform === "twitch") {
searchTwitch();
return;
}

if (currentPlatform === "twitcasting") {
searchTwitcasting();
return;
}

if (currentPlatform === "all") {
searchAll();
return;
}

}


async function searchAll() {

const result =
document.getElementById("searchResult");

result.innerHTML = "";

await searchYouTube(false);

const message =
document.createElement("div");

message.className = "empty";

message.innerHTML =
"Twitch・ツイキャスはAPI接続を追加すると、ここに同時表示されます。";

result.appendChild(message);

}


/* =========================
   YouTube検索
========================= */

async function searchYouTube(clear = true) {

const query =
document.getElementById("searchInput")
.value.trim();

const result =
document.getElementById("searchResult");

if (!query) {

result.innerHTML =
"検索したい名前を入力してください";

return;

}

if (clear) {
result.innerHTML = "検索中...";
}


try {

const url =
"https://www.googleapis.com/youtube/v3/search"
+ "?part=snippet"
+ "&type=channel"
+ "&maxResults=10"
+ "&q=" + encodeURIComponent(query)
+ "&key=" + YOUTUBE_API_KEY;


const response =
await fetch(url);


const data =
await response.json();


if (data.error) {

result.innerHTML =
"APIエラー: "
+ data.error.message;

return;

}


if (!data.items ||
data.items.length === 0) {

result.innerHTML =
"チャンネルが見つかりませんでした";

return;

}


if (clear) {
result.innerHTML = "";
}


const following =
getFollowing();


data.items.forEach(item => {

const channel =
item.snippet;

const channelId =
item.id.channelId;

const isFollowing =
following.some(
follow =>
follow.id === channelId
);


const div =
document.createElement("div");

div.className = "channel";


div.innerHTML = `

<img src="${channel.thumbnails.default.url}">

<div class="channel-info">

<div class="channel-name">
${channel.channelTitle}
</div>

<div class="channel-title">
▶ YouTube
</div>

</div>

<button
class="register-button ${isFollowing ? "registered" : ""}"
onclick='toggleFollowing(
"${channelId}",
${JSON.stringify(channel.channelTitle)},
"${channel.thumbnails.default.url}",
"youtube"
)'
>

${isFollowing ? "登録済み" : "登録"}

</button>

<button
class="open-button"
onclick="window.open(
'https://www.youtube.com/channel/${channelId}',
'_blank'
)"
>

開く

</button>

`;


result.appendChild(div);

});


} catch (error) {

result.innerHTML =
"検索できませんでした。";

}

}


/* =========================
   Twitch検索
========================= */

検索機能は準備中です。

</div>

`;

}


/* =========================
   ツイキャス検索
========================= */

function searchTwitcasting() {

document.getElementById("searchResult")
.innerHTML = `

<div class="empty">

ツイキャス検索機能は準備中です。

</div>

`;

}


/* =========================
   登録・解除
========================= */

function toggleFollowing(
channelId,
channelName,
thumbnail,
platform
) {

let following =
getFollowing();


const exists =
following.some(
item =>
item.id === channelId &&
item.platform === platform
);


if (exists) {

following =
following.filter(
item =>
!(
item.id === channelId &&
item.platform === platform
)
);

} else {

following.push({

id: channelId,
name: channelName,
thumbnail: thumbnail,
platform: platform

});

}


saveFollowing(following);


/* 検索結果を更新 */

searchCurrentPlatform();

}


/* =========================
   登録中一覧
========================= */

function loadFollowing() {

const list =
document.getElementById(
"followingList"
);

const following =
getFollowing();


if (following.length === 0) {

list.innerHTML = `

<div class="empty">

まだ誰も登録していません。<br>
検索から好きな配信者を登録しよう！

</div>

`;

return;

}


list.innerHTML = "";


following.forEach(channel => {

const div =
document.createElement("div");

div.className =
"following-channel";


let platformName = "";

if (channel.platform === "youtube") {
platformName = "▶ YouTube";
}

if (channel.platform === "twitch") {
platformName = "🟣 Twitch";
}

if (channel.platform === "twitcasting") {
platformName = "🔵 ツイキャス";
}


div.innerHTML = `

<img src="${channel.thumbnail}">

<div class="following-info">

<div class="channel-name">
${channel.name}
</div>

<div class="channel-title">
${platformName}
</div>

</div>

<button
class="remove-button"
onclick="removeFollowing(
'${channel.id}',
'${channel.platform}'
)"
>

解除

</button>

`;


list.appendChild(div);

});

}


/* =========================
   登録解除
========================= */

function removeFollowing(
channelId,
platform
) {

let following =
getFollowing();


following =
following.filter(
item =>
!(
item.id === channelId &&
item.platform === platform
)
);


saveFollowing(following);


loadFollowing();


loadLiveStreams();

}


/* =========================
   YouTubeライブ取得
========================= */

async function loadLiveStreams() {

const grid =
document.getElementById(
"liveGrid"
);


const following =
getFollowing();


const youtubeFollowing =
following.filter(
channel =>
channel.platform === "youtube"
);


if (youtubeFollowing.length === 0) {

grid.innerHTML = `

<div class="empty">

登録した配信者はいません。<br>
検索から配信者を登録してください！

</div>

`;

return;

}


grid.innerHTML =
"配信状況を確認中...";


try {

let liveStreams = [];


for (
const channel of youtubeFollowing
) {

const url =
"https://www.googleapis.com/youtube/v3/search"
+ "?part=snippet"
+ "&channelId="
+ channel.id
+ "&eventType=live"
+ "&type=video"
+ "&maxResults=5"
+ "&key="
+ YOUTUBE_API_KEY;


const response =
await fetch(url);


const data =
await response.json();


if (
data.items &&
data.items.length > 0
) {

data.items.forEach(video => {

liveStreams.push({

channelName:
channel.name,

videoTitle:
video.snippet.title,

thumbnail:
video.snippet.thumbnails.medium.url,

videoId:
video.id.videoId,

platform:
"youtube"

});

});

}

}


if (
liveStreams.length === 0
) {

grid.innerHTML = `

<div class="empty">

現在ライブ配信中の<br>
登録チャンネルはいません

</div>

`;

return;

}


grid.innerHTML = "";


liveStreams.forEach(stream => {

const div =
document.createElement("div");

div.className =
"card";


div.innerHTML = `

<div class="thumbnail">

<img
src="${stream.thumbnail}"
>

<div class="live">
LIVE
</div>

</div>


<div class="card-content">

<div class="name">
${stream.channelName}
</div>

<div class="title">
${stream.videoTitle}
</div>

<div class="info">
▶ YouTube
</div>

</div>

`;


div.onclick = function() {

window.open(
"https://www.youtube.com/watch?v="
+ stream.videoId,
"_blank"
);

};


grid.appendChild(div);

});


} catch (error) {

console.error(error);

grid.innerHTML = `

<div class="empty">

配信状況を取得できませんでした

</div>

`;

}

}


/* =========================
   Enterキー検索
========================= */

document
.getElementById("searchInput")
.addEventListener(
"keydown",
function(event) {

if (
event.key === "Enter"
) {

searchCurrentPlatform();

}

}
);


/* 最初にホームを更新 */

loadLiveStreams();


</script>

</body>
</html>
