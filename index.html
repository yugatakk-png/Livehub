<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LiveHub</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #f7f7f7;
  color: #222;
}

header {
  background: white;
  padding: 18px 20px 10px;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid #eee;
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: 800;
  color: #e60012;
  margin-bottom: 18px;
}

.platforms {
  display: flex;
  gap: 24px;
  overflow-x: auto;
  padding-bottom: 10px;
}

.platform {
  white-space: nowrap;
  color: #555;
  font-size: 14px;
  cursor: pointer;
}

.platform.active {
  color: #e60012;
  font-weight: bold;
  border-bottom: 3px solid #e60012;
  padding-bottom: 8px;
}

main {
  padding: 25px 16px 100px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 10px 0 18px;
}

.section-title h2 {
  margin: 0;
  color: #e60012;
  font-size: 28px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.card {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.thumbnail {
  height: 130px;
  background: linear-gradient(135deg, #e6e6e6, #cfcfcf);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  position: relative;
}

.live {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #e60012;
  color: white;
  font-weight: bold;
  padding: 6px 9px;
  border-radius: 7px;
  font-size: 12px;
}

.card-content {
  padding: 13px;
}

.name {
  font-weight: bold;
  font-size: 16px;
  margin-bottom: 8px;
}

.title {
  font-size: 13px;
  line-height: 1.5;
  color: #444;
}

.info {
  margin-top: 12px;
  font-size: 12px;
  color: #777;
}

.search-box {
  display: flex;
  gap: 8px;
  margin: 20px 0;
}

.search-box input {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 16px;
}

.search-box button {
  border: none;
  background: #e60012;
  color: white;
  border-radius: 12px;
  padding: 0 18px;
  font-weight: bold;
  font-size: 16px;
}

.search-result {
  margin-top: 20px;
}

.channel {
  background: white;
  border-radius: 15px;
  padding: 14px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,.07);
}

.channel img {
  width: 55px;
  height: 55px;
  border-radius: 50%;
}

.channel-info {
  flex: 1;
}

.channel-name {
  font-weight: bold;
  font-size: 16px;
}

.channel-title {
  font-size: 13px;
  color: #666;
  margin-top: 4px;
}

.open-button {
  border: none;
  background: #e60012;
  color: white;
  padding: 9px 12px;
  border-radius: 10px;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 75px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.nav-item {
  text-align: center;
  font-size: 11px;
  color: #666;
  cursor: pointer;
}

.nav-item .icon {
  font-size: 25px;
  display: block;
  margin-bottom: 3px;
}

.nav-item.active {
  color: #e60012;
  font-weight: bold;
}

@media (min-width: 700px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<header>

<div class="logo">📡 LiveHub</div>

<div class="platforms">
  <div class="platform active">すべて</div>
  <div class="platform">YouTube</div>
  <div class="platform">Twitch</div>
  <div class="platform">ツイキャス</div>
  <div class="platform">TikTok LIVE</div>
</div>

</header>

<main>

<!-- ホーム -->
<div id="homePage" class="page active">

<div class="section-title">
<h2>🔴 LIVE NOW</h2>
</div>

<div class="grid">

<div class="card">
<div class="thumbnail">🎥<div class="live">LIVE</div></div>
<div class="card-content">
<div class="name">HIKAKIN</div>
<div class="title">重大発表します。</div>
<div class="info">▶ YouTube</div>
</div>
</div>

<div class="card">
<div class="thumbnail">🎮<div class="live">LIVE</div></div>
<div class="card-content">
<div class="name">ゲーム配信者</div>
<div class="title">新作ゲームをプレイ中！</div>
<div class="info">🎮 Twitch</div>
</div>
</div>

</div>

</div>


<!-- 検索 -->
<div id="searchPage" class="page">

<div class="section-title">
<h2>🔍 チャンネル検索</h2>
</div>

<div class="search-box">
<input
id="searchInput"
type="text"
placeholder="配信者・チャンネル名を検索"
>
<button onclick="searchYouTube()">検索</button>
</div>

<div id="searchResult" class="search-result">
検索したい名前を入力してください
</div>

</div>


<!-- 登録 -->
<div id="followingPage" class="page">
<div class="section-title">
<h2>☆ 登録中</h2>
</div>

<p>登録したチャンネルがここに表示されます。</p>
</div>


<!-- 通知 -->
<div id="notificationPage" class="page">
<div class="section-title">
<h2>♧ 通知</h2>
</div>

<p>通知はありません。</p>
</div>


<!-- 設定 -->
<div id="settingsPage" class="page">
<div class="section-title">
<h2>⚙ 設定</h2>
</div>

<p>LiveHub Settings</p>
</div>

</main>


<nav class="bottom-nav">

<div class="nav-item active" onclick="showPage('homePage', this)">
<span class="icon">⌂</span>
ホーム
</div>

<div class="nav-item" onclick="showPage('searchPage', this)">
<span class="icon">⌕</span>
検索
</div>

<div class="nav-item" onclick="showPage('followingPage', this)">
<span class="icon">☆</span>
登録中
</div>

<div class="nav-item" onclick="showPage('notificationPage', this)">
<span class="icon">♧</span>
通知
</div>

<div class="nav-item" onclick="showPage('settingsPage', this)">
<span class="icon">⚙</span>
設定
</div>

</nav>


<script>

/* ↓↓↓ ここを自分のAPIキーに変更 ↓↓↓ */

const API_KEY = "AIzaSyDfnygVo-zOl6cE6DscVeBOSnp59K88Hv8";


function showPage(pageId, element) {

document.querySelectorAll(".page").forEach(page => {
page.classList.remove("active");
});

document.getElementById(pageId).classList.add("active");

document.querySelectorAll(".nav-item").forEach(item => {
item.classList.remove("active");
});

element.classList.add("active");

}


async function searchYouTube() {

const query = document.getElementById("searchInput").value.trim();

const result = document.getElementById("searchResult");

if (!query) {
result.innerHTML = "検索したい名前を入力してください";
return;
}

result.innerHTML = "検索中...";


try {

const url =
"https://www.googleapis.com/youtube/v3/search"
+ "?part=snippet"
+ "&type=channel"
+ "&maxResults=10"
+ "&q=" + encodeURIComponent(query)
+ "&key=" + API_KEY;


const response = await fetch(url);

const data = await response.json();

if (data.error) {
  console.error(data.error);
  result.innerHTML = "APIエラー: " + data.error.message;
  return;
}


if (!data.items || data.items.length === 0) {

result.innerHTML = "チャンネルが見つかりませんでした";

return;

}


result.innerHTML = "";


data.items.forEach(item => {

const channel = item.snippet;

const channelId = item.id.channelId;

const div = document.createElement("div");

div.className = "channel";


div.innerHTML = `

<img src="${channel.thumbnails.default.url}">

<div class="channel-info">

<div class="channel-name">
${channel.channelTitle}
</div>

<div class="channel-title">
${channel.title}
</div>

</div>

<button
class="open-button"
onclick="window.open('https://www.youtube.com/channel/${channelId}', '_blank')"
>

開く

</button>

`;


result.appendChild(div);

});


} catch (error) {

console.error(error);

result.innerHTML =
"検索できませんでした。APIキーの設定を確認してください。";

}

}


/* Enterキーでも検索 */

document
.getElementById("searchInput")
.addEventListener("keydown", function(event) {

if (event.key === "Enter") {

searchYouTube();

}

});

</script>

</body>
</html>
