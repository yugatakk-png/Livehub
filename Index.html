<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LiveHub</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #f7f7f7;
  color: #222;
}

header {
  background: white;
  padding: 18px 20px 10px;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid #eee;
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: 800;
  color: #e60012;
  margin-bottom: 18px;
}

.platforms {
  display: flex;
  gap: 24px;
  overflow-x: auto;
  padding-bottom: 10px;
}

.platform {
  white-space: nowrap;
  color: #555;
  font-size: 14px;
  cursor: pointer;
}

.platform.active {
  color: #e60012;
  font-weight: bold;
  border-bottom: 3px solid #e60012;
  padding-bottom: 8px;
}

main {
  padding: 25px 16px 100px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.section-title {
  margin: 10px 0 18px;
}

.section-title h2 {
  margin: 0;
  color: #e60012;
  font-size: 28px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.card {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.thumbnail {
  height: 130px;
  background: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.live {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #e60012;
  color: white;
  font-weight: bold;
  padding: 6px 9px;
  border-radius: 7px;
  font-size: 12px;
}

.card-content {
  padding: 13px;
}

.name {
  font-weight: bold;
  font-size: 16px;
  margin-bottom: 8px;
}

.title {
  font-size: 13px;
  line-height: 1.5;
  color: #444;
}

.info {
  margin-top: 12px;
  font-size: 12px;
  color: #777;
}

.search-box {
  display: flex;
  gap: 8px;
  margin: 20px 0;
}

.search-box input {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 16px;
}

.search-box button {
  border: none;
  background: #e60012;
  color: white;
  border-radius: 12px;
  padding: 0 18px;
  font-weight: bold;
  font-size: 16px;
}

.search-result {
  margin-top: 20px;
}

.channel {
  background: white;
  border-radius: 15px;
  padding: 14px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,.07);
}

.channel img {
  width: 55px;
  height: 55px;
  border-radius: 50%;
}

.channel-info {
  flex: 1;
}

.channel-name {
  font-weight: bold;
  font-size: 16px;
}

.channel-title {
  font-size: 13px;
  color: #666;
  margin-top: 4px;
}

.register-button,
.open-button {
  border: none;
  background: #e60012;
  color: white;
  padding: 9px 12px;
  border-radius: 10px;
  margin-left: 5px;
}

.registered {
  background: #777;
}

.following-channel {
  background: white;
  border-radius: 15px;
  padding: 14px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,.07);
}

.following-channel img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
}

.following-info {
  flex: 1;
}

.remove-button {
  border: none;
  background: #eee;
  color: #555;
  padding: 9px 10px;
  border-radius: 10px;
}

.empty {
  color: #777;
  text-align: center;
  padding: 40px 10px;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 75px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.nav-item {
  text-align: center;
  font-size: 11px;
  color: #666;
  cursor: pointer;
}

.nav-item .icon {
  font-size: 25px;
  display: block;
  margin-bottom: 3px;
}

.nav-item.active {
  color: #e60012;
  font-weight: bold;
}

@media (min-width: 700px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

</style>
</head>

<body>

<header>

<div class="logo">📡 LiveHub</div>

<div class="platforms">
  <div class="platform active">すべて</div>
  <div class="platform">YouTube</div>
  <div class="platform">Twitch</div>
  <div class="platform">ツイキャス</div>
  <div class="platform">TikTok LIVE</div>
</div>

</header>


<main>


<!-- ホーム -->

<div id="homePage" class="page active">

<div class="section-title">
<h2>🔴 LIVE NOW</h2>
</div>

<div id="liveGrid" class="grid">
<div class="empty">
登録したチャンネルの配信状況を確認中...
</div>
</div>

</div>



<!-- 検索 -->

<div id="searchPage" class="page">

<div class="section-title">
<h2>🔍 チャンネル検索</h2>
</div>

<div class="search-box">

<input
id="searchInput"
type="text"
placeholder="配信者・チャンネル名を検索"
>

<button onclick="searchYouTube()">検索</button>

</div>

<div id="searchResult" class="search-result">
検索したい名前を入力してください
</div>

</div>



<!-- 登録中 -->

<div id="followingPage" class="page">

<div class="section-title">
<h2>☆ 登録中</h2>
</div>

<div id="followingList"></div>

</div>



<!-- 通知 -->

<div id="notificationPage" class="page">

<div class="section-title">
<h2>♧ 通知</h2>
</div>

<p>通知はありません。</p>

</div>



<!-- 設定 -->

<div id="settingsPage" class="page">

<div class="section-title">
<h2>⚙ 設定</h2>
</div>

<p>LiveHub Settings</p>

</div>


</main>



<nav class="bottom-nav">

<div class="nav-item active"
onclick="showPage('homePage', this)">

<span class="icon">⌂</span>
ホーム

</div>


<div class="nav-item"
onclick="showPage('searchPage', this)">

<span class="icon">⌕</span>
検索

</div>


<div class="nav-item"
onclick="showPage('followingPage', this)">

<span class="icon">☆</span>
登録中

</div>


<div class="nav-item"
onclick="showPage('notificationPage', this)">

<span class="icon">♧</span>
通知

</div>


<div class="nav-item"
onclick="showPage('settingsPage', this)">

<span class="icon">⚙</span>
設定

</div>

</nav>



<script>


const API_KEY = "AIzaSyAq_G_xeVepNaXCwkRWOXtqqV1WC_K0HiE";


/* ページ切り替え */

function showPage(pageId, element) {

document.querySelectorAll(".page").forEach(page => {
page.classList.remove("active");
});

document.getElementById(pageId).classList.add("active");

document.querySelectorAll(".nav-item").forEach(item => {
item.classList.remove("active");
});

element.classList.add("active");


if (pageId === "homePage") {
loadLiveStreams();
}


if (pageId === "followingPage") {
loadFollowing();
}

}



/* 登録データ取得 */

function getFollowing() {

return JSON.parse(
localStorage.getItem("livehub_following") || "[]"
);

}



/* 登録データ保存 */

function saveFollowing(data) {

localStorage.setItem(
"livehub_following",
JSON.stringify(data)
);

}



/* YouTube検索 */

async function searchYouTube() {

const query =
document.getElementById("searchInput")
.value
.trim();

const result =
document.getElementById("searchResult");


if (!query) {

result.innerHTML =
"検索したい名前を入力してください";

return;

}


result.innerHTML = "検索中...";


try {


const url =
"https://www.googleapis.com/youtube/v3/search"
+ "?part=snippet"
+ "&type=channel"
+ "&maxResults=10"
+ "&q=" + encodeURIComponent(query)
+ "&key=" + API_KEY;


const response =
await fetch(url);


const data =
await response.json();


if (data.error) {

result.innerHTML =
"APIエラー: "
+ data.error.message;

return;

}


if (!data.items || data.items.length === 0) {

result.innerHTML =
"チャンネルが見つかりませんでした";

return;

}


result.innerHTML = "";


const following =
getFollowing();


data.items.forEach(item => {


const channel =
item.snippet;


const channelId =
item.id.channelId;


const isFollowing =
following.some(
item => item.id === channelId
);


const div =
document.createElement("div");


div.className =
"channel";


div.innerHTML = `

<img
src="${channel.thumbnails.default.url}"
>

<div class="channel-info">

<div class="channel-name">
${channel.channelTitle}
</div>

<div class="channel-title">
YouTubeチャンネル
</div>

</div>

<button
class="register-button ${isFollowing ? "registered" : ""}"
onclick='toggleFollowing(
"${channelId}",
${JSON.stringify(channel.channelTitle)},
"${channel.thumbnails.default.url}"
)'
>

${isFollowing ? "登録済み" : "登録"}

</button>

<button
class="open-button"
onclick="window.open(
'https://www.youtube.com/channel/${channelId}',
'_blank'
)"
>

開く

</button>

`;


result.appendChild(div);


});


} catch (error) {


console.error(error);


result.innerHTML =
"検索できませんでした。";


}


}



/* 登録・解除 */

function toggleFollowing(
channelId,
channelName,
thumbnail
) {


let following =
getFollowing();


const exists =
following.some(
item => item.id === channelId
);


if (exists) {


following =
following.filter(
item => item.id !== channelId
);


} else {


following.push({

id: channelId,
name: channelName,
thumbnail: thumbnail

});


}


saveFollowing(following);


/* 検索画面更新 */

searchYouTube();


}



/* 登録中表示 */

function loadFollowing() {


const list =
document.getElementById(
"followingList"
);


const following =
getFollowing();


if (following.length === 0) {


list.innerHTML = `

<div class="empty">

まだ誰も登録していません。<br>
検索から好きな配信者を登録しよう！

</div>

`;


return;


}


list.innerHTML = "";


following.forEach(channel => {


const div =
document.createElement("div");


div.className =
"following-channel";


div.innerHTML = `

<img src="${channel.thumbnail}">

<div class="following-info">

<div class="channel-name">
${channel.name}
</div>

<div class="channel-title">
YouTube
</div>

</div>

<button
class="remove-button"
onclick="removeFollowing('${channel.id}')"
>

解除

</button>

`;


list.appendChild(div);


});


}



/* 登録解除 */

function removeFollowing(channelId) {


let following =
getFollowing();


following =
following.filter(
item => item.id !== channelId
);


saveFollowing(following);


loadFollowing();


loadLiveStreams();


}



/* 配信中の動画を取得 */

async function loadLiveStreams() {


const grid =
document.getElementById(
"liveGrid"
);


const following =
getFollowing();


if (following.length === 0) {


grid.innerHTML = `

<div class="empty">

登録した配信者はいません。<br>
検索から配信者を登録してください！

</div>

`;


return;


}


grid.innerHTML = "配信状況を確認中...";


try {


let liveStreams = [];


for (
const channel of following
) {


const url =
"https://www.googleapis.com/youtube/v3/search"
+ "?part=snippet"
+ "&channelId=" + channel.id
+ "&eventType=live"
+ "&type=video"
+ "&maxResults=5"
+ "&key=" + API_KEY;


const response =
await fetch(url);


const data =
await response.json();


if (
data.items &&
data.items.length > 0
) {


data.items.forEach(video => {


liveStreams.push({

channelName:
channel.name,

videoTitle:
video.snippet.title,

thumbnail:
video.snippet.thumbnails.medium.url,

videoId:
video.id.videoId

});


});


}


}


if (
liveStreams.length === 0
) {


grid.innerHTML = `

<div class="empty">

現在ライブ配信中の<br>
登録チャンネルはいません

</div>

`;


return;


}


grid.innerHTML = "";


liveStreams.forEach(stream => {


const div =
document.createElement("div");


div.className =
"card";


div.innerHTML = `

<div class="thumbnail">

<img
src="${stream.thumbnail}"
>

<div class="live">

LIVE

</div>

</div>


<div class="card-content">


<div class="name">

${stream.channelName}

</div>


<div class="title">

${stream.videoTitle}

</div>


<div class="info">

▶ YouTube

</div>


</div>

`;


/* カードを押したら配信を開く */

div.onclick = function() {


window.open(

"https://www.youtube.com/watch?v="
+ stream.videoId,

"_blank"

);


};


grid.appendChild(div);


});


} catch (error) {


console.error(error);


grid.innerHTML = `

<div class="empty">

配信状況を取得できませんでした

</div>

`;


}


}



/* Enterで検索 */

document
.getElementById("searchInput")
.addEventListener(
"keydown",
function(event) {

if (
event.key === "Enter"
) {

searchYouTube();

}

}
);


/* 最初にホーム更新 */

loadLiveStreams();


</script>

</body>
</html>
